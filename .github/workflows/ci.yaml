name: Build Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "README.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "README.md"

concurrency:
  group: "${{ github.workflow }} @ ${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

env:
  CI: true

jobs:
  detect-changes:
    runs-on: arc-runner-set
    outputs:
      mongo-buddy-changed: ${{ steps.filter.outputs.mongo-buddy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            mongo-buddy:
              - 'rustic-mongo-buddy/**'

  tests:
    uses: ./.github/workflows/tests-workflow.yaml
    secrets: inherit

  format-and-clippy:
    uses: ./.github/workflows/format-workflow.yaml
    secrets: inherit

  build-and-push-docker-image:
    runs-on: arc-runner-set
    needs: [tests, format-and-clippy]
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.CI_AWS_ROLE }}
          aws-region: eu-west-1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          token: ${{ secrets.CI_TOKEN }}
      - name: Determine short SHA
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        id: determined-sha
        with:
          script: |
            const { ref } = context
            const isMainBranch = ref === 'refs/heads/main'

            let tag;

            if(isMainBranch) {
              tag = `master`
            } else {
              tag = ref.startsWith('refs/pull/')
                ? context.payload.pull_request.head.sha
                : context.sha
              tag = tag.slice(0, 7)
            }

            core.setOutput('sha', tag)
      - name: Upload to Blueground ECR
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          RUSTIC_WITCHER_DOCKER_IMAGE_TAG: ${{ steps.determined-sha.outputs.sha }}
        run: |
          aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
          make build_and_push_docker_image_bg

  build-and-push-mongo-buddy:
    runs-on: arc-runner-set
    needs: [tests, format-and-clippy, detect-changes]
    if: needs.detect-changes.outputs.mongo-buddy-changed == 'true'
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.CI_AWS_ROLE }}
          aws-region: eu-west-1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          token: ${{ secrets.CI_TOKEN }}
      - name: Determine short SHA
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        id: determined-sha
        with:
          script: |
            const { ref } = context
            const isMainBranch = ref === 'refs/heads/main'

            let tag;

            if(isMainBranch) {
              tag = `master`
            } else {
              tag = ref.startsWith('refs/pull/')
                ? context.payload.pull_request.head.sha
                : context.sha
              tag = tag.slice(0, 7)
            }

            core.setOutput('sha', tag)
      - name: Upload Mongo Buddy to Blueground ECR
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          RUSTIC_MONGO_BUDDY_DOCKER_IMAGE_TAG: ${{ steps.determined-sha.outputs.sha }}
        run: |
          aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
          make build_and_push_mongo_buddy_bg
